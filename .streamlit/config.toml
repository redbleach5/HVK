[theme]
base = "light"
primaryColor = "#8B7355"
backgroundColor = "#FAF8F5"
secondaryBackgroundColor = "#fffaf4"
textColor = "#3d3229"
font = "sans serif"

[server]
headless = true
fileWatcherType = "none"
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
